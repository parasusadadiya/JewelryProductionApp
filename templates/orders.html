<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>All Orders</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f4f5f7;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .order {
            display: block;
            background: white;
            color: #222;
            text-decoration: none;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-number {
            font-size: 20px;
            font-weight: bold;
        }

        .customer {
            margin-top: 8px;
            font-size: 17px;
        }

        .details {
            margin-top: 8px;
            color: #666;
        }

        .back {
            display: block;
            text-align: center;
            background: #ddd;
            color: #222;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            margin-top: 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>📋 All Orders</h1>


    {% for order in orders %}

    <a
        class="order"
        href="/orders/{{ order['id'] }}">

        <div class="order-number">

            {{ order["order_number"] }}

        </div>


        <div class="customer">

            Customer ID:
            {{ order["customer_id"] }}

        </div>


        <div class="details">

            Type:
            {{ order["order_type"] }}

            <br>

            Stage:
            {{ order["current_stage"] }}

            <br>

            Status:
            {{ order["status"] }}

        </div>

    </a>

    {% else %}

    <div class="order">

        No orders found.

    </div>

    {% endfor %}


    <a
        class="back"
        href="/">

        ← Back to Dashboard

    </a>

</div>

</body>

</html>
